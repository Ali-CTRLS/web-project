<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create Medical Report — MedCare Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
  <div id="componentHeader"></div>
  <main class="container">
    <h1 class="section-title">Create Medical Report</h1>
    <p class="muted">Generate a new medical report for a patient.</p>

    <div class="form-card">
      <h2 style="margin-top:0">Medical Report</h2>
      <form>
        <div class="form-group">
          <label for="patient">Select Patient:</label>
          <select id="patient" required>
            <option value="">-- Choose patient --</option>
            <option value="p001">John Doe (ID: P001)</option>
            <option value="p002">Jane Smith (ID: P002)</option>
            <option value="p003">Robert Wilson (ID: P003)</option>
            <option value="p004">Emily Brown (ID: P004)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reporttype">Report Type:</label>
          <select id="reporttype" required>
            <option value="">-- Select type --</option>
            <option value="physical">Physical Examination</option>
            <option value="lab">Laboratory Results</option>
            <option value="imaging">Imaging Report</option>
            <option value="consultation">Consultation Notes</option>
            <option value="followup">Follow-up Report</option>
            <option value="discharge">Discharge Summary</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Report Date:</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-group">
          <label for="findings">Clinical Findings:</label>
          <textarea id="findings" placeholder="Document your observations and clinical findings..." required></textarea>
        </div>

        <div class="form-group">
          <label for="diagnosis">Diagnosis:</label>
          <textarea id="diagnosis" placeholder="Primary and secondary diagnoses..." required></textarea>
        </div>

        <div class="form-group">
          <label for="treatment">Treatment Plan:</label>
          <textarea id="treatment" placeholder="Recommended treatment and medications..." required></textarea>
        </div>

        <div class="form-group">
          <label for="medications">Prescribed Medications:</label>
          <textarea id="medications" placeholder="List medications: name, dosage, frequency, duration..." required></textarea>
        </div>

        <div class="form-group">
          <label for="followup">Follow-up Instructions:</label>
          <textarea id="followup" placeholder="Instructions for patient follow-up care..."></textarea>
        </div>

        <div class="form-group">
          <label for="notes">Additional Notes:</label>
          <textarea id="notes" placeholder="Any other relevant information..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn primary">Save Report</button>
          <button type="button" class="btn ghost" onclick="window.print()">Print Report</button>
          <button type="reset" class="btn ghost">Clear</button>
        </div>
      </form>
    </div>
  </main>
  <div id="componentFooter"></div>
  <script src="/src/js/main.js"></script>
</body>
</html>
